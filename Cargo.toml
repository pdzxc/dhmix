[package]
name = "streammix"
version = "0.1.0"
edition = "2021"
description = "Free, open virtual audio mixer for streaming (Voicemeeter-style): 6 input strips, 5 hardware + 2 virtual buses, per-strip denoiser/gate/EQ/compressor/echo/reverb."
license = "MIT"

[[bin]]
name = "streammix"
path = "src/main.rs"

[lib]
name = "streammix"
path = "src/lib.rs"

[dependencies]
cpal = "0.15"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
nnnoiseless = { version = "0.5", default-features = false }
ringbuf = "0.4"
hound = "3.5"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
global-hotkey = "0.6"
rfd = "0.15"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
